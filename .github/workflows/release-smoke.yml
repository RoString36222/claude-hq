name: release-smoke

# Ships the Arena on the runner the way ops/release.sh ships it on the VPS:
# one release, a second release of a newer commit, then a rollback to the first,
# checking health and the stamped version each time.
on:
  pull_request:
    paths: ["backend/**", "backend-rs/**", "ops/**", ".github/workflows/release-smoke.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "backend-rs/**", "ops/**", ".github/workflows/release-smoke.yml"]

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ARENA_DOMAIN: localhost
      ARENA_SKIP_CI: "1"
      ARENA_SKIP_PULL: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Minimal .env
        run: printf 'ARENA_SECRET_KEY=ci-only\n' > backend/.env
      - name: First release
        run: ops/release.sh deploy
      - name: Remember its version
        run: ops/release.sh status | sed -n '2p' | tee first.txt
      # A new commit stamps a new version (date + commit), so there is
      # something to roll back from.
      - name: A newer commit
        run: |
          git -c user.name=ci -c user.email=ci@localhost commit -q --allow-empty -m "smoke: a newer commit"
      - name: Second release
        run: ops/release.sh deploy
      - name: The newer release is running
        run: |
          ops/release.sh status | tee status.txt
          ! diff -q <(sed -n '2p' status.txt) first.txt
          grep -q '(rs)' status.txt
      - name: Roll back
        run: ops/release.sh rollback
      - name: The first release is running again
        run: |
          ops/release.sh status | tee status.txt
          diff <(sed -n '2p' status.txt) first.txt
          grep -q 'healthy' status.txt
      - name: Logs on failure
        if: failure()
        run: cd backend && docker compose --env-file .env --env-file .release.env logs --tail 80 app || true
