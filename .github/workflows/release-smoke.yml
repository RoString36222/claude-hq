name: release-smoke

# Ships the Arena on the runner the way ops/release.sh ships it on the VPS:
# Python release, Rust release (with the Alembic migrate step), then a rollback
# to the Python one, checking health and the stamped version each time.
on:
  pull_request:
    paths: ["backend/**", "backend-rs/**", "ops/**", ".github/workflows/release-smoke.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "backend-rs/**", "ops/**", ".github/workflows/release-smoke.yml"]

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ARENA_DOMAIN: localhost
      ARENA_SKIP_CI: "1"
      ARENA_SKIP_PULL: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Minimal .env
        run: printf 'ARENA_SECRET_KEY=ci-only\n' > backend/.env
      - name: Release the Python Arena
        run: ops/release.sh deploy
      - name: Release the Rust Arena
        run: ARENA_IMPL=rs ops/release.sh deploy
      - name: Rust is running
        run: ops/release.sh status | tee status.txt && grep -q '(rs)' status.txt
      - name: Roll back to the Python Arena
        run: ops/release.sh rollback
      - name: Python is running again
        run: |
          ops/release.sh status | tee status.txt
          grep -q '(py)' <(sed -n '2p' status.txt)
          grep -q 'healthy' status.txt
      - name: Logs on failure
        if: failure()
        run: cd backend && docker compose --env-file .env --env-file .release.env logs --tail 80 app || true
