name: ci

# The checks every PR and main must pass. On main, once they all have, the
# release job publishes the Arena release ops/release.sh deploys on the host.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Repo-level checks: frontend <-> Arena sync (game data, protocol tables),
  # the deploy panel and release scripts. Stdlib only; node runs the JS halves.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run repo tests
        run: python3 -m unittest discover -s tests -v

  # The Arena server (backend/): tests, lints, and the exact image a deploy builds.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Run Arena tests
        run: cargo test --locked
      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build the deploy image
        run: docker build --build-arg ARENA_VERSION=ci -t claude-hq-arena:ci .
      - name: Image answers its health check
        run: |
          docker run -d --name arena -e ARENA_SECRET_KEY=ci-only -e ARENA_DATABASE_URL=sqlite:/tmp/arena.db claude-hq-arena:ci
          for i in $(seq 1 30); do docker exec arena arena-health && exit 0; sleep 1; done
          docker logs arena; exit 1

  # The local HQ server (dashboard-rs/), on macOS like the people who run it.
  dashboard:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: dashboard-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dashboard-rs
      - name: Run HQ server tests
        run: cargo test --locked
      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Release build
        run: cargo build --release --locked
      # The page itself: claudehq serves it from a throwaway folder and headless
      # Chrome loads it; any JavaScript error while loading fails the job.
      - name: UI smoke test
        working-directory: .
        run: python3 tools/ui_smoke.py dashboard-rs/target/release/claudehq
      # City Gen v4 phase 11: one page load, eleven spots on the @3 Commons (interchange, flyover, boulevard, tram bed
      # and platform, tunnel, cutting, signals, plaza, metro, your HQ), each within 1,200 draw calls a frame (240
      # below the street) and 1.5 M triangles, no page error. The shots are kept as an artifact.
      - name: Graphics tour (frame budgets)
        working-directory: .
        timeout-minutes: 10
        run: python3 tools/graphics_tour.py dashboard-rs/target/release/claudehq --out "$RUNNER_TEMP/graphics-tour"
      - name: Keep the graphics tour's shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphics-tour
          path: ${{ runner.temp }}/graphics-tour
          if-no-files-found: ignore

  # On main, once every check above has passed: the Arena release the host deploys
  # (ops/release.sh deploy). The image goes to ghcr.io, tagged with its version, and the
  # GitHub release "arena-latest" (a pre-release, so the app's own release stays Latest)
  # carries arena-release.json and arena-config-<version>.tar.gz (ops/release_bundle.py).
  # The new config is uploaded before the manifest that names it, and the last few are
  # kept, so a host reading the release mid-update never gets a manifest without its config.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, backend, dashboard]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: arena-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Version and image
        id: v
        run: |
          echo "version=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y.%m.%d)-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-arena" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the Arena image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: backend
          build-args: ARENA_VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish arena-latest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          IMAGE: ${{ steps.v.outputs.image }}@${{ steps.push.outputs.digest }}
        run: |
          python3 ops/release_bundle.py dist "$VERSION" "$GITHUB_SHA" "$IMAGE"
          gh release view arena-latest >/dev/null 2>&1 || gh release create arena-latest --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "Arena (latest)" --notes "The Arena release the host deploys (ops/release.sh deploy). Updated by CI on every green commit on main."
          gh release upload arena-latest "dist/arena-config-$VERSION.tar.gz" --clobber
          gh release upload arena-latest dist/arena-release.json --clobber
          gh release edit arena-latest --notes "Arena $VERSION (${GITHUB_SHA:0:7}): $IMAGE. Updated by CI on every green commit on main; ops/release.sh deploy reads it."
          # keep the five newest configs
          gh release view arena-latest --json assets --jq '.assets | sort_by(.createdAt) | reverse | .[].name' \
            | grep '^arena-config-' | tail -n +6 \
            | while read -r old; do gh release delete-asset arena-latest "$old" -y; done
