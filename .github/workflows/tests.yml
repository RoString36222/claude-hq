name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Frontend and tooling tests (stdlib Python + node). The page they check is
  # assembled by the HQ server itself (tests/hq.py runs `claudehq --print-index`),
  # so this job needs Rust too.
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dashboard-rs
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  # The local HQ server (claudehq).
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dashboard-rs
      - name: Run Rust tests
        run: cargo test --locked
      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --all-targets -- -D warnings

  # The Arena server.
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rs
      - name: Run Rust tests
        run: cargo test --locked
      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --all-targets -- -D warnings
