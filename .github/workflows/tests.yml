name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Stdlib only — nothing to install.
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # Matches the Dockerfile's base image.
          python-version: "3.12"
      # Installs pyproject.toml's dependencies plus the dev group (pytest).
      - name: Install dependencies
        run: uv sync
      - name: Run backend tests
        run: uv run pytest -q
      # The container runs `alembic upgrade head` at start, which fails outright
      # if two revisions both claim to follow the same parent.
      - name: Single alembic head
        run: test "$(uv run alembic heads | grep -c '(head)')" = "1"

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rs
      - name: Run Rust tests
        run: cargo test --locked
      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --all-targets -- -D warnings
