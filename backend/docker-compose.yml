# Claude HQ Arena on any VM with Docker.
#
#   1. point your domain's A record at the VM's IP
#   2. cp .env.example .env   and fill it in
#   3. ARENA_DOMAIN=arena.yourdomain.com docker compose up -d
#
# Caddy obtains and renews the TLS certificate automatically, so there is no
# certbot cron to forget about.

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # The volume, not the image: the database must survive a redeploy.
      ARENA_DATABASE_URL: sqlite+aiosqlite:////data/arena.db
      ARENA_PUBLIC_BASE_URL: https://${ARENA_DOMAIN:?set ARENA_DOMAIN}
    volumes:
      - arena-data:/data
    # Deliberately NOT published to the host: Caddy is the only way in.
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Optional: only started with `--profile panel`, so instances that do not
  # want a deploy panel are unaffected.
  panel:
    profiles: ["panel"]
    build:
      context: ../ops
      dockerfile: Dockerfile.panel
    restart: unless-stopped
    env_file: /etc/arena-panel.env
    environment:
      ARENA_DIR: /repo
      ARENA_DOMAIN: ${ARENA_DOMAIN:?set ARENA_DOMAIN}
      ARENA_DEPLOY_LOG: /repo/.arena-deploy.log
    volumes:
      # The repo it deploys, and the socket it deploys with. This is root-
      # equivalent access -- but the panel can already execute deploys, so
      # containerising it does not widen what it can do, only where it runs.
      - ${ARENA_DIR:-/root/claude-hq}:/repo
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8090"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      ARENA_DOMAIN: ${ARENA_DOMAIN:?set ARENA_DOMAIN}
      # Set by ops/install-panel.sh. Empty when the panel is not installed,
      # which is fine because the Caddyfile block that uses them is only
      # appended by that installer.
      PANEL_DOMAIN: ${PANEL_DOMAIN:-}
      PANEL_UPSTREAM: ${PANEL_UPSTREAM:-}
    ports:
      - "80:80"     # needed for the ACME HTTP challenge, and redirects to 443
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # certificates live here -- keep this volume
      - caddy-config:/config

volumes:
  arena-data:
  caddy-data:
  caddy-config:
