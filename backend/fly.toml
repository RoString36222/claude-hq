# Claude HQ Arena. Rename `app` before the first deploy.
app = "claude-hq-arena"
primary_region = "bom"          # Mumbai; see `fly platform regions`

[build]

[env]
  ARENA_PUBLIC_BASE_URL = "https://claude-hq-arena.fly.dev"
  # SQLite on the mounted volume. Four slashes = absolute path.
  ARENA_DATABASE_URL = "sqlite+aiosqlite:////data/arena.db"

# One machine, one volume. Rooms are in-process (see app/rooms.py) and SQLite
# is a single file, so this app is deliberately not horizontally scalable.
# Losing this volume costs only history older than 30 days: every client
# republishes a rolling 30-day window every 5 minutes.
[mounts]
  source = "arena_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true

  # Rooms hold presence and shared state in process memory, so this service
  # must run as exactly ONE machine. Scaling out means moving rooms behind
  # Redis pub/sub first -- see app/rooms.py.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    # Websockets are long-lived; a low limit would shed game clients.
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks.health]
  type = "http"
  port = 8080
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
