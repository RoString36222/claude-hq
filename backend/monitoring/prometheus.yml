# Prometheus for the Arena (docker compose --profile monitoring). It scrapes the
# Arena's metrics listener (ARENA_METRICS_BIND, app:9091, never routed by Caddy)
# and node-exporter for the VPS itself, over the compose network only.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: arena
    static_configs:
      - targets: ["app:9091"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
