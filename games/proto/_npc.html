<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#cfd8d2;overflow:hidden}</style></head><body>
<script src="/games/engine.js"></script><script src="/games/avatar3d.js"></script><script src="/games/people3d.js"></script><script src="/games/npcdraw.js"></script>
<script>
var E=HQV.engine, Q=new URLSearchParams(location.search);
if(Q.get("kenney")) HQV.people3d.crowd=null;
E.lib().then(function(L){ var THREE=L.THREE, r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); r.setSize(innerWidth,innerHeight); r.shadowMap.enabled=true; document.body.appendChild(r.domElement);
 var S=new THREE.Scene(); S.background=new THREE.Color(0xcfd8d2); S.add(new THREE.HemisphereLight(0xf3f7ff,0x8a9a5a,1.4)); var d=new THREE.DirectionalLight(0xfff3e2,2.2); d.position.set(10,20,8); d.castShadow=true; S.add(d);
 var gnd=new THREE.Mesh(new THREE.PlaneGeometry(400,400), new THREE.MeshStandardMaterial({color:0x9aa79e})); gnd.rotation.x=-Math.PI/2; gnd.receiveShadow=true; S.add(gnd);
 var cam=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,400); cam.position.set(0,6,16); cam.lookAt(0,1,0);
 var SH=[0xe63946,0xf4a261,0x2a9d8f,0x264653,0xe9c46a,0x8d5cf6,0xff6fb5,0x3a86ff], SK=[0xf1c27d,0xe0ac69,0xc68642,0x8d5524,0xffdbac,0x5c3a21];
 var N=+(Q.get("n")||400), res=[];
 for(var i=0;i<N;i++){ var f=function(k){ var h=Math.imul(i*131+k,0x85ebca6b); h^=h>>>13; return ((h>>>0)%1000)/1000; }; res.push({id:i, look:{char:i%6, shirt:SH[i%8], pants:0x333333, skin:SK[(i*7)%6]}, x0:(f(1)-0.5)*160, z0:(f(2)-0.5)*160, yaw:f(3)*6.28, sit: i%9===0}); }
 var sim={residents:res, warm:function(){}, speak:function(){return "hi";}, at:function(t,c,R){ var out=[]; res.forEach(function(p){ var s=p.sit?0:1.3, tt=t/1000, x=p.x0+Math.sin(p.yaw)*s*((tt%20)-10), z=p.z0+Math.cos(p.yaw)*s*((tt%20)-10); var dx=x-c.x, dz=z-c.z, d2=dx*dx+dz*dz; if(d2<R*R) out.push({id:p.id,x:x,y:0,z:z,yaw:p.yaw,anim:p.sit?"sit":"walk",speed:s,d2:d2}); }); out.sort(function(a,b){return a.d2-b.d2}); return out; }};
 var draw=HQV.npcDraw.create(THREE,S,sim,{lib:L}), t=0, ms=[], rms=[];
 function frame(){ var a=performance.now(); t+=33; draw.update(t,{x:0,z:0},null,0.033); var b=performance.now(); r.render(S,cam); var c=performance.now(); ms.push(b-a); rms.push(c-b); if(ms.length>200){ms.shift(); rms.shift();} requestAnimationFrame(frame); }
 frame();
 window.__stats=function(){ var avg=function(a){ return (a.reduce(function(x,y){return x+y},0)/Math.max(1,a.length)).toFixed(2); }; return {update:avg(ms), render:avg(rms), calls:r.info.render.calls, tris:r.info.render.triangles, st:draw.stats}; };
 setTimeout(function(){ window.__ready=true; }, 9000);
});
</script></body></html>
