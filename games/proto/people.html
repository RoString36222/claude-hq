<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>People Lineup</title>
<style>html,body{margin:0;height:100%;background:#e4ebe6;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<script src="/games/engine.js"></script>
<script src="/games/avatar3d.js"></script>
<script src="/games/people3d.js"></script>
<script>
(function(){
var E = HQV.engine;
var SPECS = [
  [0, 1, 2, 0, 0, 0, 0, 0, 0, 0], [1, 3, 1, 1, 0, 2, 0, 0, 0, 0], [2, 2, 3, 3, 0, 0, 1, 0, 0, 0],
  [3, 4, 1, 0, 0, 1, 0, 0, 0, 0], [4, 5, 4, 5, 0, 3, 2, 0, 0, 0], [5, 6, 2, 2, 1, 0, 3, 1, 0, 0],
  [0, 1, 9, 9, 2, 5, 0, 1, 0, 1], [1, 7, 5, 6, 0, 4, 0, 0, 0, 0]
];
E.lib().then(function(L){
  var THREE = L.THREE, r = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
  r.setSize(innerWidth, innerHeight); r.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(r.domElement);
  var S = new THREE.Scene(); S.background = new THREE.Color(0xe4ebe6);
  S.add(new THREE.HemisphereLight(0xf3f7ff, 0x8a9a5a, 1.6));
  var d = new THREE.DirectionalLight(0xfff3e2, 2.2); d.position.set(2, 4, 5); S.add(d);
  var cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 50);
  var view = new URLSearchParams(location.search).get("view");
  if(view === "heads"){ cam.position.set(0, 0.62, 2.0); cam.lookAt(0, 0.6, 0); }
  else { cam.position.set(0, 0.5, 3.6); cam.lookAt(0, 0.38, 0); }
  Promise.all(SPECS.map(function(s){ return HQV.people3d.build(s); })).then(function(chs){
    chs.forEach(function(ch, i){
      ch.o.position.x = (i - (chs.length - 1) / 2) * 0.42;
      ch.o.rotation.y = 0.25;
      if(i === 7 && ch.acts.sit){ ch.acts.sit.play(); } else if(ch.acts.idle){ ch.acts.idle.play(); }
      ch.mixer.update(0.5); ch.update(0.5);
      S.add(ch.o);
    });
    var seat = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.19, 0.3), new THREE.MeshStandardMaterial({color: 0x8a6a4a}));
    seat.position.set(chs[7].o.position.x, 0.095, -0.05); S.add(seat);
    r.render(S, cam);
    window.__ready = true;
  }).catch(function(e){ console.error("build failed", e && e.stack || e); window.__ready = true; });
});
})();
</script>
</body>
</html>
